<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WC26 Stickers" />
  <title>World Cup 2026 — Sticker Tracker</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <!-- FIFA banner across the top -->
  <div class="hero">
    <img class="hero-img" src="assets/wc2026.png?v=5" alt="FIFA World Cup 2026" />
    <button id="shareBtn" class="icon-btn hero-share" aria-label="Share & menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3M8 7l4-4 4 4" />
        <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" />
      </svg>
    </button>
  </div>

  <header class="controls">
    <h1 id="appTitle">Sticker Tracker</h1>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" class="search" type="search" inputmode="search"
             placeholder="Search e.g. mex12, Brazil, 12" autocomplete="off" />
      <button id="searchClear" class="search-clear" aria-label="Clear search">×</button>
    </div>
    <div id="searchResult" class="search-result hidden"></div>

    <div class="segmented" role="tablist">
      <button class="seg active" data-view="album" role="tab">Album</button>
      <button class="seg" data-view="trade" role="tab">Trade</button>
      <button class="seg" data-view="compare" role="tab">Compare</button>
      <span class="seg-thumb" aria-hidden="true"></span>
    </div>

    <div class="filters" id="filters">
      <button class="chip-btn active" data-filter="all">All</button>
      <button class="chip-btn" data-filter="missing">Missing</button>
      <button class="chip-btn" data-filter="dupes">Spares</button>
    </div>
  </header>

  <div id="modeBanner" class="mode-banner hidden"></div>
  <nav class="group-nav" id="groupNav"></nav>

  <main id="main"></main>

  <!-- Panini banner footer at the bottom -->
  <footer class="panini-footer">
    <img src="assets/panini.jpg?v=5" alt="Panini" />
    <span class="footer-tag">Sticker Tracker · World Cup 2026</span>
  </footer>

  <!-- Share / menu sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h3>Share &amp; trade</h3>
      <button class="sheet-item primary" id="shareLink">
        <span class="si-emoji">📤</span>
        <span><b>Share this tracker</b><small>Send the link so friends can view &amp; compare</small></span>
      </button>
      <button class="sheet-item" id="copyList">
        <span class="si-emoji">📋</span>
        <span><b>Copy my collection</b><small>Paste it into a friend's Compare tab</small></span>
      </button>
      <button class="sheet-item" id="startMine">
        <span class="si-emoji">✨</span>
        <span><b>Start my own album</b><small>Track your own stickers on this device</small></span>
      </button>

      <div class="sheet-sep"></div>

      <button class="sheet-item" id="unlockBtn">
        <span class="si-emoji">🔒</span>
        <span><b>Unlock editing</b><small>Owner only — enter the password</small></span>
      </button>
      <div id="ownerTools" class="hidden">
        <button class="sheet-item" id="exportBtn"><span class="si-emoji">⬇️</span><span><b>Backup</b><small>Save your collection to a file</small></span></button>
        <label class="sheet-item" for="importInput"><span class="si-emoji">⬆️</span><span><b>Restore</b><small>Load a backup file</small></span>
          <input id="importInput" type="file" accept="application/json" class="hidden" />
        </label>
        <button class="sheet-item" id="lockBtn"><span class="si-emoji">🔓</span><span><b>Lock (view only)</b><small>Turn editing back off</small></span></button>
        <button class="sheet-item danger" id="resetBtn"><span class="si-emoji">♻️</span><span><b>Reset</b><small>Clear all marks</small></span></button>
      </div>

      <p class="sheet-note">Friends always see a read-only copy — nobody can change your album.</p>
      <button class="sheet-close" id="sheetClose">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js?v=5"></script>
  <script src="seed.js?v=5"></script>
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
