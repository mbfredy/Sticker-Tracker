name: Deploy sticker tracker to GitHub Pages

# Publishes the static app on every push to the working branch (or main).
on:
  push:
    branches:
      - claude/world-cup-sticker-tracker-m8947c
      - main
  workflow_dispatch:

# Permissions the deploy needs (and lets the workflow enable Pages itself).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
